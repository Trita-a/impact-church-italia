<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Non Trovata | Impact Church Italia</title>
    <link rel="icon" type="image/png" href="images/logo-icon.png">

    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:site_name" content="Impact Church Italia">
    <meta property="og:title" content="Pagina Non Trovata - Impact Church Italia">
    <meta property="og:description" content="Impact Church Italia - Comunità cristiana evangelica a Città della Pieve (PG).">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://impactchurchitalia.com/404.html">
    <meta property="og:image" content="https://impactchurchitalia.com/images/og-image.jpg?v=3">
    <meta property="og:image:secure_url" content="https://impactchurchitalia.com/images/og-image.jpg?v=3">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Impact Church Italia">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Impact Church Italia">
    <meta name="twitter:description" content="Comunità cristiana evangelica a Città della Pieve (PG).">
    <meta name="twitter:image" content="https://impactchurchitalia.com/images/og-image.jpg?v=3">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --color-primary: #111827;
            --color-accent: #b58b5a;
            --color-accent-light: #dcbfa0;
            --color-bg-light: #fafaf9;
            /* Warm white/cream */
            --color-text: #1f2937;
            --color-text-muted: #6b7280;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --radius-full: 9999px;
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background-color: var(--color-bg-light);
            color: var(--color-text);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background-color: rgba(181, 139, 90, 0.15);
            /* Accent color low opacity */
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background-color: rgba(220, 191, 160, 0.2);
            /* Accent light */
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background-color: rgba(181, 139, 90, 0.1);
            top: 40%;
            left: 20%;
            animation: float 15s infinite ease-in-out reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(30px, 50px) rotate(10deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(-5deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        /* 404 Error Code */
        .error-code {
            font-size: 10rem;
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1;
            color: var(--color-accent);
            text-shadow: 0 10px 30px rgba(181, 139, 90, 0.2);
            margin: 0;
            display: inline-block;
            animation: breathe 6s infinite ease-in-out;
            position: relative;
        }

        /* Decorative line through */
        .error-code::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -20px;
            right: -20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-accent-light), transparent);
            animation: scan 4s infinite linear;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(100%);
            }

            50% {
                transform: scale(1.02);
                filter: brightness(110%);
            }
        }

        @keyframes scan {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Content Text */
        .error-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-top: -20px;
            margin-bottom: 1.5rem;
            color: var(--color-primary);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.3s;
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--color-text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.6s;
        }

        .divider {
            width: 80px;
            height: 3px;
            background-color: var(--color-accent);
            margin: 0 auto 2rem;
            border-radius: 2px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.5s;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background-color: var(--color-primary);
            color: white;
            text-decoration: none;
            font-weight: 500;
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.9s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .btn i {
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: translateX(-3px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: 1.75rem;
            }

            .shape-1,
            .shape-2 {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="container">
        <h1 class="error-code">404</h1>

        <div class="divider"></div>

        <h2 class="error-title">Sentiero non trovato</h2>

        <p class="error-message">
            Oops! Sembra che tu abbia perso la bussola. <br>
            Ma non preoccuparti, ogni smarrimento è un'opportunità per ritrovare la strada giusta.
        </p>

        <a href="index.html" class="btn">
            <i class="fas fa-arrow-left"></i> Ritrova la Strada
        </a>
    </div>

</body>

</html>
